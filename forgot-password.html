<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — Ariful Islam</title><style>:root{--bg:#f7f9fc;--panel:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--accent:#059669}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--text)}.card{width:min(420px,92%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 25px 70px #0001}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:10px 0;font:inherit}button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700}.msg{margin-top:12px;font-size:.82rem;color:var(--muted)}a{color:var(--accent)}</style></head><body><main class="card"><h2>Password Reset</h2><p>আপনার account-এর email দিন। Firebase password reset email পাঠাবে।</p><input id="email" type="email" placeholder="you@example.com"><button id="send">Reset Password</button><div id="msg" class="msg"></div><p><a href="login.html">← Login</a></p></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getAuth,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";const a=initializeApp({apiKey:"AIzaSyDQlOU5V2JwOOII-89IfwqTeGWhiJLMW8Y",authDomain:"live-chat-5fb87.firebaseapp.com",projectId:"live-chat-5fb87",storageBucket:"live-chat-5fb87.firebasestorage.app",messagingSenderId:"981108059379",appId:"1:981108059379:web:0172685d73f066d02adb86"}),auth=getAuth(a);send.onclick=async()=>{msg.textContent="";try{await sendPasswordResetEmail(auth,email.value.trim());msg.textContent="Reset email পাঠানো হয়েছে। Inbox/Spam দেখুন।"}catch(e){msg.textContent=e.message}};</script></body></html>
