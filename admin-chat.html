<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ariful Islam — Live Chat Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--panel:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--accent:#059669;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans Bengali",sans-serif}.app{height:100vh;display:grid;grid-template-columns:330px 1fr}.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}.top{padding:18px;border-bottom:1px solid var(--line)}.top h2{margin:0;font-size:1.05rem}.top p{margin:5px 0 0;color:var(--muted);font-size:.75rem}.chats{overflow:auto}.chat{padding:15px 17px;border-bottom:1px solid var(--line);cursor:pointer}.chat:hover,.chat.active{background:#eefbf7}.chat b{display:block}.chat small{display:block;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{float:right;background:#e7f7f1;color:var(--accent);border-radius:99px;padding:2px 7px;font-size:.65rem}.main{display:flex;flex-direction:column}.head{padding:15px 20px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.head b{font-size:.95rem}.btn{border:0;border-radius:9px;padding:9px 12px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.messages{flex:1;overflow:auto;padding:22px}.bubble{max-width:min(70%,620px);padding:10px 13px;border-radius:14px;margin:8px 0;font-size:.86rem;white-space:pre-wrap}.bubble.visitor{background:var(--accent);color:#fff;margin-left:auto;border-bottom-right-radius:4px}.bubble.admin{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}.bubble small{display:block;opacity:.6;font-size:.64rem;margin-top:4px}.composer{padding:12px;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:8px}.composer textarea{flex:1;resize:none;height:44px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}.login{height:100vh;display:grid;place-items:center}.loginbox{background:#fff;padding:30px;border:1px solid var(--line);border-radius:18px;width:min(380px,90%);text-align:center}.loginbox button{width:100%;margin-top:15px}.hidden{display:none!important}@media(max-width:760px){.app{grid-template-columns:1fr}.side{height:38vh}.main{height:62vh}.bubble{max-width:85%}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><h2>💬 Live Chat Admin</h2><p>শুধু অনুমোদিত Admin account দিয়ে প্রবেশ করুন।</p><button id="loginBtn" class="btn">Google দিয়ে Sign in</button><p id="err" style="color:#b42318;font-size:.75rem"></p></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="top"><h2>Live Chats</h2><p id="adminEmail"></p></div><div id="chatList" class="chats"></div></aside><main class="main"><div class="head"><b id="chatTitle">একটি chat নির্বাচন করুন</b><button id="logout" class="btn">Logout</button></div><div id="messages" class="messages"></div><div class="composer"><textarea id="input" placeholder="Reply লিখুন..."></textarea><button id="send" class="btn">Send</button></div></main></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,query,orderBy,onSnapshot,addDoc,serverTimestamp,doc,setDoc} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAcPJkmhqToGVVzNK3z5QyzJMEZvzT91rM",authDomain:"giga-trail-9sjh2.firebaseapp.com",projectId:"giga-trail-9sjh2",storageBucket:"giga-trail-9sjh2.firebasestorage.app",messagingSenderId:"814994801193",appId:"1:814994801193:web:9f0e02dab060392cdf9238"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),ADMIN="ariful40807@gmail.com";
const $=id=>document.getElementById(id);let chats=[],selected=null,unsub=null;
$("loginBtn").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$("err").textContent=e.message}};
onAuthStateChanged(auth,user=>{if(!user)return; if(user.email!==ADMIN){$("err").textContent="এই Google account অনুমোদিত নয়।";signOut(auth);return} $("login").classList.add("hidden");$("app").classList.remove("hidden");$("adminEmail").textContent=user.email;listenChats()});
$("logout").onclick=()=>signOut(auth);
function listenChats(){const q=query(collection(db,"chats"),orderBy("updatedAt","desc"));onSnapshot(q,s=>{chats=s.docs.map(d=>({id:d.id,...d.data()}));renderChats()})}
function renderChats(){ $("chatList").innerHTML=chats.map(c=>'<div class="chat '+(selected===c.id?'active':'')+'" data-id="'+c.id+'"><span class="badge">'+(c.status||"open")+'</span><b>'+esc(c.visitorName||"Visitor")+'</b><small>'+esc(c.lastSender==="admin"?"আপনার reply":"Visitor-এর message")+'</small></div>').join("");document.querySelectorAll(".chat").forEach(x=>x.onclick=()=>selectChat(x.dataset.id))}
function selectChat(id){selected=id;renderChats();const c=chats.find(x=>x.id===id);$("chatTitle").textContent=c?.visitorName||"Chat";if(unsub)unsub();const q=query(collection(db,"chats",id,"messages"),orderBy("createdAt","asc"));unsub=onSnapshot(q,s=>{ $("messages").innerHTML=s.docs.map(d=>{const m=d.data(),who=m.sender==="admin"?"admin":"visitor",t=m.createdAt?.toDate?.().toLocaleString("bn-BD")||"";return '<div class="bubble '+who+'">'+esc(m.text||"")+'<small>'+who+" · "+t+"</small></div>"}).join("");$("messages").scrollTop=$("messages").scrollHeight})}
$("send").onclick=send; $("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
async function send(){const t=$("input").value.trim();if(!t||!selected)return;$("input").value="";await addDoc(collection(db,"chats",selected,"messages"),{text:t,sender:"admin",senderName:ADMIN,createdAt:serverTimestamp()});await setDoc(doc(db,"chats",selected),{updatedAt:serverTimestamp(),lastSender:"admin",status:"open"},{merge:true})}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script></body></html>
