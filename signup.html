<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up — Ariful Islam</title><style>:root{--bg:#f7f9fc;--panel:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--accent:#059669;--accent2:#2563eb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#05966916,transparent 30%),radial-gradient(circle at 90% 80%,#2563eb16,transparent 30%),var(--bg);font-family:Inter,Arial,sans-serif;color:var(--text)}.card{width:min(430px,92%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 25px 80px #10182814}.logo{font-weight:800;font-size:1.15rem}.logo span{color:var(--accent)}h1{margin:24px 0 7px;font-size:2rem}p{color:var(--muted);font-size:.88rem}label{display:block;font-size:.8rem;font-weight:700;margin:15px 0 6px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--text);font:inherit;outline:none}button{width:100%;border:0;border-radius:11px;padding:12px;margin-top:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;cursor:pointer}.google{background:var(--text)}.links{text-align:center;margin-top:18px;font-size:.82rem}.links a{color:var(--accent);font-weight:700;text-decoration:none}.error{color:#b42318;font-size:.78rem;min-height:20px;margin-top:10px}.note{font-size:.72rem;text-align:center;margin-top:18px}</style></head><body><main class="card"><a class="logo" href="index.html">ARIFUL <span>ISLAM</span></a><h1>অ্যাকাউন্ট তৈরি করুন</h1><p>অ্যাকাউন্ট তৈরি করে Portfolio Live Chat-এ সরাসরি কথা বলুন।</p><form id="form"><label>আপনার নাম</label><input id="name" required maxlength="80" placeholder="যেমন: মোঃ রহিম"><label>Email</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"><label>Password</label><input id="password" type="password" required minlength="6" autocomplete="new-password" placeholder="কমপক্ষে ৬ অক্ষর"><button type="submit">Create Account</button></form><button id="google" class="google" type="button">Continue with Google</button><div id="error" class="error"></div><div class="links">আগেই account আছে? <a href="login.html">Login করুন</a></div><p class="note">Password website code-এ রাখা হয় না; Firebase Authentication এটি পরিচালনা করে।</p></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getAuth,createUserWithEmailAndPassword,updateProfile,GoogleAuthProvider,signInWithPopup}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";const app=initializeApp({apiKey:"AIzaSyDQlOU5V2JwOOII-89IfwqTeGWhiJLMW8Y",authDomain:"live-chat-5fb87.firebaseapp.com",projectId:"live-chat-5fb87",storageBucket:"live-chat-5fb87.firebasestorage.app",messagingSenderId:"981108059379",appId:"1:981108059379:web:0172685d73f066d02adb86",measurementId:"G-6992KVEVPG"}),auth=getAuth(app),error=document.getElementById("error");function go(){location.href="index.html#chat"}form.onsubmit=async e=>{e.preventDefault();error.textContent="";try{const c=await createUserWithEmailAndPassword(auth,email.value.trim(),password.value);if(name.value.trim())await updateProfile(c.user,{displayName:name.value.trim()});go()}catch(x){error.textContent=x.code==="auth/email-already-in-use"?"এই email দিয়ে account আগে থেকেই আছে।":x.message}};google.onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider());go()}catch(x){error.textContent=x.message}};</script></body></html>
